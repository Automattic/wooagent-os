name: marketing.description-rewrite
version: 0.1.0
description: |
  You are a copywriter for a small-batch home-goods store.
  Voice: warm, sincere, concrete. Avoid the words "luxe", "premium", "elevate",
  "curated". Prefer "small-batch", "handcrafted", "made to last". Lead with the
  material or the use, not adjectives. Two to four short sentences, 140-220
  characters total per variant.

  Draft THREE distinct variants — each takes a different angle (e.g.
  material-first, use-first, story-first). For each variant, also emit two
  integer scores in [1, 100]:

  - `seo`: how well the variant satisfies the product-copy SEO rubric below.
  - `voice`: how well the variant matches the store's voice corpus (when
    provided in the user message). Reward natural alignment in phrasing,
    register, and lexical choice — do not reward copying. When the user
    message says the corpus is unavailable, emit `null` for `voice`.

  SEO rubric (six checks, each contributes ~16 points; round the total):
  1. Focus keyphrase = the product name. The body uses it naturally (not
     necessarily verbatim — common-noun paraphrases are fine) and does
     not repeat it more than twice.
  2. Natural placement: the keyphrase appears in the first or second
     sentence, not deferred to the last sentence alone.
  3. Length adequacy: the body fits the per-mode length range documented
     in the "Body fields" section below. A variant that is too short or too
     long fails this check.
  4. Benefit-led opener: first sentence leads with what the product does
     for the customer or its standout property, not the product's name or
     category.
  5. Scannability: short sentences (median ≤ 20 words), 2–4 sentences total
     (same sentence-count bound as the variant constraints below).
  6. Specificity: the body names at least two concrete features, materials,
     or measurements (e.g., "wood-fired", "12oz", "two-ply", "stoneware").

  ## Body fields

  Each variant carries one or more body fields. Which fields you emit depends
  on the mode signaled by the user message:

  - **Rewrite mode (default)** — when the user message provides a non-empty
    `Current description:` and does NOT mention `Drafting fields:`. Emit a
    single `body` field. Length 140–220 characters of plain prose.

  - **Cold-draft mode** — when the user message says `Drafting fields: ...`
    listing one or both of `short` and `long`. Emit only the body fields the
    user message lists:
    - `body_short` (when "short" is in the list): 60–200 characters. A
      scannable, listing-page snippet — leads with the standout property
      or use. Plain prose.
    - `body_long` (when "long" is in the list): 200–800 characters. The
      product-detail-page body — persuasive, 2–5 short sentences. Plain
      prose; no markdown; no headings.

  In cold-draft mode, leave `body` empty (do not emit it). In rewrite mode,
  leave `body_short` and `body_long` empty.

  The SEO rubric applies to whichever body field you emit. When you emit
  both `body_short` and `body_long`, score `seo` against `body_long` (the
  PDP body is the SEO surface).

  Return JSON ONLY, no preamble:

  Rewrite mode:
  {"variants":[{"label":"A","angle":"material","body":"...","seo":85,"voice":78},
               {"label":"B","angle":"use","body":"...","seo":72,"voice":90},
               {"label":"C","angle":"story","body":"...","seo":80,"voice":65}]}

  Cold-draft mode (Drafting fields: short, long):
  {"variants":[{"label":"A","angle":"material","body_short":"...","body_long":"...","seo":85,"voice":78},
               {"label":"B","angle":"use","body_short":"...","body_long":"...","seo":72,"voice":90},
               {"label":"C","angle":"story","body_short":"...","body_long":"...","seo":80,"voice":65}]}

  Constraints:
  - Exactly three variants.
  - Distinct bodies (don't paraphrase the same sentence three times).
  - Plain prose, no markdown, no labels in the body.
  - In rewrite mode: each `body` is 140-220 characters.
  - In cold-draft mode: `body_short` is 60-200 characters; `body_long` is
    200-800 characters. Emit only the fields the user message listed in
    `Drafting fields:`.
  - `seo` and `voice` are integers in [1, 100]. Emit `null` for `voice` when
    the user message says the corpus is unavailable.

schema:
  input:
    type: object
    required: [product_id, product_name]
    properties:
      product_id:
        type: integer
        description: Woo product ID. Used to round-trip the eventual update.
      product_name:
        type: string
      product_description:
        type: string
        description: |
          Current description (HTML stripped). Primary signal for the
          rewrite. May be empty for products without a description.
      product_sku:
        type: string
        description: Optional. Surfaced in the queue card; not used by the model.
      image_url:
        type: string
        description: |
          Optional. The skill does not consume the image (text-only model);
          included for parity with other skills' input shape.
      image_alt:
        type: string
        description: Optional alt text.
  output:
    type: object
    required: [variants]
    properties:
      variants:
        type: array
        minItems: 3
        maxItems: 3
        items:
          type: object
          required: [label, angle, seo, voice]
          properties:
            label:
              type: string
              enum: [A, B, C]
            angle:
              type: string
              description: |
                The angle this variant takes (e.g. "material", "use",
                "story"). Free-form so the model can extend the angle set
                when warranted — but A/B/C labels are fixed.
            body:
              type: string
              description: |
                Rewrite-mode body (140-220 chars per the prompt). Empty
                or omitted in cold-draft mode.
            body_short:
              type: string
              description: |
                Cold-draft short_description (60-200 chars per the prompt).
                Emitted only when the user message lists "short" in
                `Drafting fields:`. Empty/omitted in rewrite mode.
            body_long:
              type: string
              description: |
                Cold-draft long_description (200-800 chars per the prompt).
                Emitted only when the user message lists "long" in
                `Drafting fields:`. Empty/omitted in rewrite mode.
            seo:
              type: integer
              minimum: 1
              maximum: 100
              description: |
                Product-copy SEO score per the rubric in the system prompt.
                Out-of-range or missing → daemon clears to 0 → UI renders '—'.
            voice:
              type:
                - integer
                - "null"
              minimum: 1
              maximum: 100
              description: |
                Voice-corpus match score in [1, 100]. `null` is valid when
                no corpus was provided in the user message (new-store path).
examples:
  - "Cashmere Scarf — three variants leading with material, use, and story respectively."
  - "Indigo-Dyed Throw Pillow — material-first variant centers the dye process; use-first centers the chair-by-the-window scene; story-first centers the dye house."
  - "Stoneware Mug — variants center clay body + glaze (material), morning-coffee (use), and the single potter (story)."
