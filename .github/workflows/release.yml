name: Release

# Push a tag like v0.1.0 (or v0.1.0-rc.1 for a prerelease) and this
# workflow cross-compiles the wooagent binary for the supported platforms,
# packages the Companion Plugin zip, and publishes a GitHub Release with
# every artifact + a SHA256SUMS file. install.sh consumes that release.
#
# Cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Validate locally without publishing (requires goreleaser installed):
#   goreleaser release --snapshot --clean

on:
  push:
    tags:
      - "v*"

permissions:
  # Required for goreleaser to create the release and upload assets.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the changelog generator can read prior tags
          # to build the release notes.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: daemon/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Node is required because goreleaser's before-hooks build the
          # React UI and copy it into the daemon's embed dir before
          # cross-compiling. See .goreleaser.yaml's `before:` block.
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Keep a stable major version; new minor/patch releases of
          # goreleaser within v2 are picked up automatically.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
